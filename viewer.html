<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council of Achrona · debat</title>
<style>
  :root {
    --bg: #f4f1ea; --paneel: #fffdf8; --paneel-2: #f9f6ef; --tekst: #1f1b16; --zacht: #6f675c; --lijn: #e4ddcf;
    --goud: #a87a14; --goud-zacht: #f6ecd2; --ok: #2f7d4a; --waarschuwing: #b45309; --fout: #b3261e;
    --archmage: #6b4fd8; --engineer: #c2700a; --guardian_keeper: #0b7fb8; --historian: #8a5a12;
    --oracle: #b8286a; --beast_master: #2f7d4a; --koning: #a87a14; --mens: #b3261e;
    --schaduw: 0 1px 2px rgb(60 40 10 / .06), 0 4px 14px rgb(60 40 10 / .05);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Mono", ui-monospace, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #15130f; --paneel: #1e1b16; --paneel-2: #24201a; --tekst: #efe9dd; --zacht: #a39a8b; --lijn: #332e26;
    --goud: #e0b54a; --goud-zacht: #2e2615; --ok: #6cc28a; --waarschuwing: #f0a540; --fout: #f27b72;
    --archmage: #a891ff; --engineer: #f3a43b; --guardian_keeper: #4cb8ef; --historian: #d6a35c;
    --oracle: #f070a8; --beast_master: #6cc28a; --koning: #e0b54a; --mens: #f27b72;
    --schaduw: 0 1px 2px rgb(0 0 0 / .3);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 140px; }
  body { margin: 0; background: var(--bg); color: var(--tekst); font: 15px/1.55 var(--sans); }
  button { font: inherit; color: inherit; }
  code { font-family: var(--mono); font-size: 12.5px; }

  /* ---------- kop ---------- */
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
           backdrop-filter: saturate(1.2) blur(6px); border-bottom: 1px solid var(--lijn); }
  .kop { max-width: 1440px; margin: 0 auto; padding: 12px 24px 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px 24px; align-items: center; }
  .merk { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .zegel { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px;
           background: radial-gradient(circle at 35% 30%, #f6dc8f, var(--goud) 72%); box-shadow: inset 0 -2px 0 rgb(0 0 0 / .18); }
  .merk h1 { font: 600 20px/1.1 var(--serif); margin: 0; letter-spacing: .01em; }
  .merk small { display: block; color: var(--zacht); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .budget { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .budget-label { font-size: 11px; color: var(--zacht); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .pips { display: flex; gap: 5px; }
  .pip { width: 22px; height: 8px; border-radius: 4px; background: var(--lijn); transition: background .4s; }
  .pip.vol { background: var(--kleur, var(--goud)); }
  .pip.stop { background: transparent; border: 1.5px dashed var(--goud); }
  .rechts { display: flex; align-items: center; gap: 10px; justify-self: end; }
  .status { font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--lijn); background: var(--paneel); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--zacht); }
  .status.bezig::before { background: var(--waarschuwing); animation: puls 1.2s infinite; }
  .status.klaar::before { background: var(--ok); }
  .status.afgebroken { color: var(--fout); border-color: var(--fout); } .status.afgebroken::before { background: var(--fout); }
  .icoonknop { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--lijn); background: var(--paneel); cursor: pointer; }
  .icoonknop:hover { border-color: var(--goud); }
  nav.tabs { max-width: 1440px; margin: 0 auto; padding: 8px 24px 0; display: flex; gap: 4px; align-items: center; }
  .tab { border: 0; background: none; padding: 8px 14px 10px; cursor: pointer; color: var(--zacht); border-bottom: 2px solid transparent; font-weight: 550; display: flex; gap: 6px; align-items: center; }
  .tab:hover { color: var(--tekst); }
  .tab[aria-selected="true"] { color: var(--tekst); border-bottom-color: var(--goud); }
  .tab .tel { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--paneel-2); border: 1px solid var(--lijn); color: var(--zacht); font-weight: 500; }
  .tab .tel.nieuw { background: var(--goud); color: #fff; border-color: var(--goud); animation: puls 1.6s infinite; }
  .sneltoets { margin-left: auto; font-size: 12px; color: var(--zacht); }
  kbd { font: 11px var(--mono); color: var(--zacht); border: 1px solid var(--lijn); border-radius: 4px; padding: 0 4px; }

  /* ---------- layout ---------- */
  main { max-width: 1440px; margin: 0 auto; padding: 20px 24px 80px; }
  .paneel-tab[hidden] { display: none; }
  .debat-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
  @media (max-width: 1000px) {
    .debat-grid { grid-template-columns: 1fr; } .rail { position: static !important; max-height: none !important; }
    .budget, .sneltoets { display: none; } .kop { grid-template-columns: 1fr auto; }
  }
  .rail { position: sticky; top: 132px; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 150px); overflow: auto; padding-bottom: 8px; }
  .kaart { background: var(--paneel); border: 1px solid var(--lijn); border-radius: 14px; box-shadow: var(--schaduw); }
  .kaart > h2, .sectiekop { font: 600 12px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--zacht); margin: 0; }
  .kaart > h2 { padding: 14px 16px 10px; }
  .kaart-body { padding: 0 16px 14px; }

  /* ---------- de Raad ---------- */
  .raad { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .zetel { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--paneel); border: 1px solid var(--lijn);
           cursor: pointer; text-align: left; transition: transform .15s, border-color .15s, opacity .2s; min-height: 56px; }
  .zetel:hover { transform: translateY(-1px); border-color: var(--kleur); }
  .zetel[aria-pressed="true"] { border-color: var(--kleur); background: color-mix(in srgb, var(--kleur) 9%, var(--paneel)); }
  .zetel.stil { opacity: .55; }
  .zetel .naam { font-weight: 600; font-size: 13.5px; line-height: 1.2; }
  .zetel .sub { font-size: 11.5px; color: var(--zacht); font-variant-numeric: tabular-nums; }
  .zetel.spreekt .avatar { animation: wiebel 1.6s ease-in-out infinite; box-shadow: 0 0 0 4px color-mix(in srgb, var(--kleur) 25%, transparent); }
  .filterinfo { font-size: 13px; color: var(--zacht); margin: -8px 0 14px; }
  .filterinfo button { border: 0; background: none; color: var(--goud); cursor: pointer; text-decoration: underline; padding: 0; }

  .avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; line-height: 1;
            background: color-mix(in srgb, var(--kleur) 15%, var(--paneel)); border: 1.5px solid var(--kleur); }
  .avatar.groot { width: 40px; height: 40px; font-size: 20px; }

  /* ---------- tijdlijn ---------- */
  .ronde-kop { display: flex; align-items: center; gap: 12px; margin: 26px 0 12px; color: var(--zacht); font: 600 12px var(--sans); letter-spacing: .09em; text-transform: uppercase; }
  .ronde-kop::after { content: ""; flex: 1; height: 1px; background: var(--lijn); }
  .ronde-kop:first-child { margin-top: 0; }

  .decreet { display: grid; grid-template-columns: 40px 1fr; gap: 12px; margin: 10px 0; animation: binnen .35s ease-out both; }
  .decreet .avatar { margin: 3px 3px 0; }
  .decreet .lijf { background: var(--goud-zacht); border: 1px solid color-mix(in srgb, var(--goud) 35%, transparent); border-radius: 14px; padding: 10px 14px; min-width: 0; }
  .decreet .regel1 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; }
  .decreet .naar { font-weight: 650; }
  .decreet .vraag { margin: 6px 0 0; font-size: 14.5px; }
  details.waarom { margin-top: 6px; font-size: 13px; color: var(--zacht); }
  details.waarom summary { cursor: pointer; list-style: none; color: var(--goud); font-weight: 600; font-size: 12.5px; display: inline-flex; gap: 4px; align-items: center; }
  details.waarom summary::-webkit-details-marker { display: none; }
  details.waarom summary::before { content: "▸"; transition: transform .15s; display: inline-block; }
  details.waarom[open] summary::before { transform: rotate(90deg); }
  details.waarom .inhoud { margin-top: 6px; color: var(--tekst); }
  .open-lijst { margin: 4px 0 0; padding-left: 18px; }
  .decreet.stop .lijf { background: var(--paneel); border: 1.5px dashed var(--goud); }

  .bericht { display: grid; grid-template-columns: 40px 1fr; gap: 12px; margin: 10px 0 18px; animation: binnen .35s ease-out both; }
  .bericht .lijf { background: var(--paneel); border: 1px solid var(--lijn); border-radius: 14px; box-shadow: var(--schaduw); overflow: hidden; min-width: 0; }
  .bericht .kopregel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 16px; border-bottom: 1px solid var(--lijn);
                       background: linear-gradient(90deg, color-mix(in srgb, var(--kleur) 9%, transparent), transparent 65%); }
  .bericht .wie { font-weight: 650; color: var(--kleur); }
  .bericht .meta { margin-left: auto; font-size: 12px; color: var(--zacht); font-variant-numeric: tabular-nums; display: flex; gap: 10px; align-items: center; }
  .bericht .tekst { padding: 12px 16px 14px; overflow-wrap: anywhere; }
  .kern { font-size: 15.5px; font-weight: 500; margin: 0 0 6px; }
  .deel { margin-top: 10px; }
  .deel-label { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--zacht); margin-bottom: 3px; }
  .deel ul { margin: 0; padding-left: 18px; } .deel li { margin: 2px 0; }
  .deel.onzeker { background: var(--paneel-2); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
  .bronnen { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 16px; border-top: 1px dashed var(--lijn); font-size: 12px; color: var(--zacht); background: var(--paneel-2); }
  .bron code { color: var(--tekst); }
  .bericht.koning .lijf { border: 1.5px solid var(--goud); }
  .bericht:target .lijf, .decreet:target .lijf { outline: 2px solid var(--goud); outline-offset: 2px; }

  .denkt .lijf { padding: 12px 16px; color: var(--zacht); font-style: italic; }
  .stippen { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
  .stippen i { width: 6px; height: 6px; border-radius: 50%; background: var(--kleur); animation: stip 1.2s infinite; }
  .stippen i:nth-child(2) { animation-delay: .15s; } .stippen i:nth-child(3) { animation-delay: .3s; }

  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
          border: 1px solid var(--lijn); color: var(--zacht); background: var(--paneel); white-space: nowrap; }
  .chip.doel { color: var(--goud); border-color: color-mix(in srgb, var(--goud) 45%, transparent); text-transform: uppercase; letter-spacing: .05em; font-size: 10.5px; }
  .chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .chip.fout { color: var(--fout); border-color: var(--fout); }
  .chip.let { color: var(--waarschuwing); border-color: var(--waarschuwing); }
  a.ref { color: var(--goud); font: 600 12px var(--mono); text-decoration: none; } a.ref:hover { text-decoration: underline; }
  .id { display: inline-block; font: 500 11.5px/1.5 var(--mono); padding: 0 5px; border-radius: 5px; white-space: nowrap;
        background: color-mix(in srgb, var(--kleur-id) 12%, transparent); color: var(--kleur-id); border: 1px solid color-mix(in srgb, var(--kleur-id) 35%, transparent); }
  .id.raar { outline: 2px dotted var(--waarschuwing); }
  .leeg { color: var(--zacht); font-style: italic; }

  /* ---------- rail ---------- */
  .slot { padding: 9px 0; border-top: 1px solid var(--lijn); font-size: 13.5px; }
  .slot:first-child { border-top: 0; padding-top: 0; }
  .slot-kop { display: flex; justify-content: space-between; align-items: center; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--zacht); margin-bottom: 3px; }
  .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--lijn); display: inline-block; margin-right: 6px; }
  .lamp.aan { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  ol.vragen { margin: 4px 0 0; padding-left: 18px; font-size: 13px; } ol.vragen li { margin: 3px 0; }
  .check { font-size: 13px; padding: 3px 0 3px 24px; position: relative; }
  .check::before { position: absolute; left: 0; top: 4px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
  .check.ok::before { content: "✓"; background: var(--ok); }
  .check.fout::before { content: "✗"; background: var(--fout); }
  .check.let::before { content: "!"; background: var(--waarschuwing); }

  /* ---------- verdict ---------- */
  .verdict-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
  @media (max-width: 1000px) { .verdict-grid { grid-template-columns: 1fr; } }
  .samenvatting { font: 400 19px/1.6 var(--serif); padding: 24px 28px 24px 48px; margin-bottom: 22px; position: relative; }
  .samenvatting::before { content: "“"; position: absolute; left: 14px; top: 6px; font: 64px/1 var(--serif); color: var(--goud); opacity: .55; }
  .oorzaak { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 10px 0 24px; }
  @media (max-width: 1200px) { .oorzaak { grid-template-columns: 1fr; } }
  .oorzaak .kaart { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .oorzaak h3 { margin: 0; font: 600 18px var(--serif); display: flex; align-items: center; gap: 8px; }
  .oorzaak .wat { font-size: 12px; color: var(--zacht); margin-top: -8px; }
  .meter { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--zacht); font-variant-numeric: tabular-nums; }
  .meter .balk { flex: 1; height: 6px; border-radius: 3px; background: var(--lijn); overflow: hidden; }
  .meter .balk i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--goud), var(--ok)); transition: width .8s ease; }
  .ids { display: flex; flex-wrap: wrap; gap: 4px; }
  .stappen { list-style: none; counter-reset: stap; margin: 0; padding: 0; }
  .stappen li { counter-increment: stap; display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--lijn); }
  .stappen li:first-child { border-top: 0; padding-top: 4px; }
  .stappen li::before { content: counter(stap); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--serif); background: var(--goud-zacht); color: var(--goud); border: 1px solid color-mix(in srgb, var(--goud) 40%, transparent); }
  .stappen .actie { font-weight: 600; }
  .stappen .reden { font-size: 13.5px; color: var(--zacht); margin: 2px 0 6px; }
  .voorspelling { text-align: center; padding: 22px 18px; background: radial-gradient(circle at 50% 0%, var(--goud-zacht), var(--paneel) 75%); }
  .voorspelling .dag { font: 700 56px/1 var(--serif); color: var(--goud); margin: 8px 0 4px; }
  .voorspelling p { font-size: 13.5px; text-align: left; margin: 10px 0; }
  .risico { padding: 10px 0; border-top: 1px solid var(--lijn); font-size: 13.5px; } .risico:first-child { border-top: 0; padding-top: 0; }
  .risico b { display: block; font-weight: 600; }
  .risico .mit { color: var(--zacht); margin-top: 3px; } .risico .mit::before { content: "↳ "; color: var(--ok); font-weight: 700; }

  /* ---------- geschillen ---------- */
  .geschillen { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
  @media (max-width: 700px) { .geschillen { grid-template-columns: 1fr; } }
  .geschil { padding: 16px 18px; }
  .geschil h3 { margin: 0 0 10px; font: 600 16px/1.35 var(--serif); display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .standpunt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; margin: 8px 0; font-size: 13.5px; }
  .standpunt .avatar { width: 28px; height: 28px; font-size: 14px; }
  .uitkomst { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--ok) 9%, var(--paneel)); font-size: 13.5px; }
  .uitkomst.open { background: color-mix(in srgb, var(--waarschuwing) 10%, var(--paneel)); }

  /* ---------- controle ---------- */
  .controle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; align-items: start; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; color: var(--zacht); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 0; }
  td { padding: 6px 0; border-top: 1px solid var(--lijn); } td.r, th.r { text-align: right; }

  .melding { padding: 56px 20px; text-align: center; color: var(--zacht); }
  .melding .groot { font-size: 40px; display: block; margin-bottom: 8px; }

  @keyframes puls { 50% { opacity: .4; } }
  @keyframes stip { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
  @keyframes wiebel { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  @keyframes binnen { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }
  :focus-visible { outline: 2px solid var(--goud); outline-offset: 2px; }

  /* ---------- compact lezen ---------- */
  .klem { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--regels, 3); overflow: hidden; }
  .klem.open { display: block; -webkit-line-clamp: unset; overflow: visible; }
  .meer { border: 0; background: none; padding: 0; margin-top: 2px; color: var(--goud); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .meer:hover { text-decoration: underline; }
  .bewijs-lijst { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .bewijs-lijst li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: baseline; font-size: 14px; }
  .bewijs-lijst li.zonder-tijd { grid-template-columns: 1fr; }
  .wanneer { font: 600 11.5px var(--mono); color: var(--zacht); background: var(--paneel-2); border: 1px solid var(--lijn); border-radius: 6px; padding: 0 6px; text-align: center; white-space: nowrap; }
  .bewijs-lijst li.verborgen { display: none; }
  .bewijs-lijst.open li.verborgen { display: grid; }
  details.extra { margin-top: 10px; font-size: 13.5px; }
  details.extra > summary { cursor: pointer; color: var(--zacht); font-size: 12.5px; font-weight: 600; list-style: none; }
  details.extra > summary::-webkit-details-marker { display: none; }
  details.extra > summary::before { content: "▸ "; }
  details.extra[open] > summary::before { content: "▾ "; }
  details.ids-uit > summary { cursor: pointer; list-style: none; font-size: 12px; color: var(--zacht); font-weight: 600; }
  details.ids-uit > summary::-webkit-details-marker { display: none; }
  details.ids-uit > summary::before { content: "▸ "; }
  details.ids-uit[open] > summary::before { content: "▾ "; }
  details.ids-uit .ids { margin-top: 6px; }
  .schakel { display: inline-flex; border: 1px solid var(--lijn); border-radius: 9px; overflow: hidden; background: var(--paneel); }
  .schakel button { border: 0; background: none; padding: 6px 10px; font-size: 12.5px; cursor: pointer; color: var(--zacht); }
  .schakel button[aria-pressed="true"] { background: var(--goud-zacht); color: var(--tekst); font-weight: 600; }

  /* ---------- overzicht van het debat ---------- */
  .verloop { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 12px 14px; margin-bottom: 18px; scrollbar-width: thin; }
  .verloop-label { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--zacht); margin-right: 8px; white-space: nowrap; }
  .stap { flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: inherit; padding: 2px 4px; border-radius: 10px; }
  .stap:hover { background: var(--paneel-2); }
  .stap .avatar { width: 30px; height: 30px; font-size: 15px; }
  .stap small { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--zacht); max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pijl { flex: none; color: var(--lijn); font-size: 14px; margin-bottom: 14px; }
  .stap.einde .avatar { border-style: dashed; }

  /* ---------- rustige weergave: één leeskolom, alleen het belangrijkste ---------- */
  .raad, .rail, .sneltoets, .schakel, .filterinfo { display: none !important; }
  #tab-debat { max-width: 860px; margin: 0 auto; }
  .debat-grid { display: block; }
  .verloop { background: none; border: 0; box-shadow: none; padding: 0 0 6px; margin-bottom: 8px; justify-content: center; }
  .verloop-label { display: none; }
  .ronde-kop { margin: 30px 0 10px; font-size: 11px; }
  .decreet .lijf { background: none; border: 0; padding: 2px 0 0; }
  .decreet .regel1 { font-size: 13px; color: var(--zacht); }
  .decreet .naar { font-weight: 600; }
  .decreet .vraag { font-size: 15px; margin-top: 2px; color: var(--tekst); }
  .decreet.stop .lijf { border: 0; }
  .bericht { margin: 8px 0 6px; }
  .bericht .kopregel { border-bottom: 0; padding: 10px 16px 0; background: none; }
  .bericht .tekst { padding: 4px 16px 12px; }
  .kern { font-size: 15.5px; }
  .deel { margin-top: 8px; }
  details.extra { margin-top: 8px; }
  .bronnen { border-top: 0; background: none; padding: 6px 0 0; }
  .vink { color: var(--ok); font-size: 12px; font-weight: 600; }
  .vink.fout { color: var(--fout); }
  .merk small { display: none; }
  .tab .tel { display: none; }
  .tab .tel.nieuw { display: inline; width: 8px; height: 8px; padding: 0; font-size: 0; border-radius: 50%; }
</style>
</head>
<body>
<header>
  <div class="kop">
    <div class="merk">
      <div class="zegel" aria-hidden="true">👑</div>
      <div style="min-width:0"><h1>Council of Achrona</h1><small id="runid">wachten op trace.json…</small></div>
    </div>
    <div class="budget" title="Beurtenbudget: maximaal 10 Raadslid-beurten">
      <span class="budget-label" id="budget-label">Beurtenbudget</span>
      <div class="pips" id="pips"></div>
    </div>
    <div class="rechts">
      <span class="schakel" role="group" aria-label="Leesweergave"><button data-dicht="kort" aria-pressed="true" title="Lange tekst ingekort, details uitklapbaar">Kort</button><button data-dicht="vol" aria-pressed="false" title="Alle tekst volledig">Volledig</button></span>
      <span id="status" class="status">wachten</span>
      <button class="icoonknop" id="thema" title="Licht / donker" aria-label="Licht of donker thema">◐</button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="debat" aria-selected="true">Debat <span class="tel" id="tel-debat">0</span></button>
    <button class="tab" role="tab" data-tab="verdict" aria-selected="false">Verdict <span class="tel" id="tel-verdict">—</span></button>
    <button class="tab" role="tab" data-tab="geschillen" aria-selected="false">Geschillen <span class="tel" id="tel-geschillen">0</span></button>
    <button class="tab" role="tab" data-tab="controle" aria-selected="false">Controle <span class="tel" id="tel-controle">—</span></button>
    <span class="sneltoets"><kbd>1</kbd>–<kbd>4</kbd> tabs · klik een Raadslid om te filteren · <kbd>Esc</kbd> wist filter</span>
  </nav>
</header>

<main>
  <section class="paneel-tab" id="tab-debat">
    <div class="raad" id="raad"></div>
    <div class="kaart verloop" id="verloop" hidden></div>
    <div class="filterinfo" id="filterinfo" hidden></div>
    <div class="debat-grid">
      <div class="tijdlijn" id="debat"><p class="melding"><span class="groot">🕯️</span>Nog geen <code>trace.json</code>. Start de Council met <code>uv run council</code>; het debat verschijnt hier live.</p></div>
      <aside class="rail">
        <div class="kaart"><h2>Werkgeheugen van de Koning</h2><div class="kaart-body" id="stand"><span class="leeg">nog geen routering</span></div></div>
        <div class="kaart"><h2>Spelregels</h2><div class="kaart-body" id="checks-kort"></div></div>
      </aside>
    </div>
  </section>
  <section class="paneel-tab" id="tab-verdict" hidden><div id="verdict"></div></section>
  <section class="paneel-tab" id="tab-geschillen" hidden><div id="geschillen"></div></section>
  <section class="paneel-tab" id="tab-controle" hidden><div class="controle-grid" id="controle"></div></section>
</main>

<script>
const NAMEN = { archmage: "Archmage", engineer: "Engineer", guardian_keeper: "Guardian Keeper", historian: "Historian",
  oracle: "Oracle", beast_master: "Beast Master", koning: "Koning", mens: "Mens" };
const AVATAR = { archmage: "🧙", engineer: "⚙️", guardian_keeper: "🛡️", historian: "📜", oracle: "🔮", beast_master: "🐺", koning: "👑", mens: "🙋" };
const BEURTENBUDGET = 10;
const PREFIX = { ARC: "archmage", ENG: "engineer", GUA: "guardian_keeper", HIS: "historian", ORA: "oracle", BEA: "beast_master" };
const ID_RE = /\b(ARC|ENG|GUA|HIS|ORA|BEA)([-\u2010-\u2015\u2212])(\d{3})\b/g;
const SLOTS = { ingreep: ["Ingreep", "wie deed wat, wanneer", "🔧"], mechanisme: ["Mechanisme", "hoe dat tot de symptomen leidt", "🧩"], verloop: ["Verloop", "het patroon in de tijd", "📈"] };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kleur = rol => `var(--${NAMEN[rol] ? rol : "koning"})`;
const naam = rol => NAMEN[rol] || rol || "?";
const av = (rol, extra = "") => `<span class="avatar ${extra}" style="--kleur:${kleur(rol)}" title="${esc(naam(rol))}">${AVATAR[rol] || "•"}</span>`;
const ref = n => `<a class="ref" href="#b${n}" data-ga="${n}">#${n}</a>`;
const $ = id => document.getElementById(id);

let vorige = "", filter = null, laatste = null, verdictGezien = false, tab = "debat";
let dicht = "kort";
const kort = () => dicht === "kort";
/* Lange tekst: in de Kort-weergave ingeklemd op n regels, met 'lees meer' (alleen als het echt overloopt). */
const klem = (html, n = 3) => kort() ? `<div class="klem" style="--regels:${n}">${html}</div>` : `<div>${html}</div>`;
/* "beurt 12" in vrije tekst wordt een link naar die beurt. */
const beurtLinks = html => html.replace(/\b(beurten?|beurt)\s+(\d+(?:\s*(?:,|en)\s*\d+)*)/gi,
  (m, w, ns) => `${w} ` + ns.replace(/\d+/g, n => `<a class="ref" href="#b${n}" data-ga="${n}">${n}</a>`));
/* ID's: in de Kort-weergave ingeklapt achter een teller. */
const idBlok = (lijst, label = "bewijs") => !(lijst || []).length ? "" : kort()
  ? `<details class="ids-uit"><summary>${lijst.length} ${label}-ID's</summary>${idChips(lijst)}</details>` : idChips(lijst);

function opmaak(tekst) {
  return esc(tekst)
    .replace(/^#{1,4}\s*(.+)$/gm, "<strong>$1</strong>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(ID_RE, (m, p, streep, n) => {
      const raar = streep !== "-";
      return `<span class="id${raar ? " raar" : ""}" style="--kleur-id:${kleur(PREFIX[p])}" title="${raar ? "Geen gewoon koppelteken: dit ID faalt op het schema" : naam(PREFIX[p])}">${p}-${n}</span>`;
    })
    .replace(/\n/g, "<br>");
}
const idChips = lijst => (lijst || []).length ? `<div class="ids">${lijst.map(i => opmaak(i)).join("")}</div>` : "";
const ids = tekst => [...String(tekst ?? "").matchAll(ID_RE)].map(m => ({ id: `${m[1]}-${m[3]}`, raar: m[2] !== "-" }));

/* Raadslid-antwoord in de vorm "Antwoord: / Bewijs: / Verwijzingen: / Onzeker:" netjes opdelen. */
function structuur(tekst, details = "") {
  const t = String(tekst || "");
  const delen = [...t.matchAll(/^\s*\**(Antwoord|Bewijs|Verwijzingen|Onzeker)\**\s*:\s*/gim)];
  if (delen.length < 2) return klem(opmaak(t), 6) + (details ? `<details class="extra"><summary>Details</summary>${details}</details>` : "");
  const stukken = {};
  delen.forEach((m, i) => { stukken[m[1].toLowerCase()] = t.slice(m.index + m[0].length, i + 1 < delen.length ? delen[i + 1].index : undefined).trim(); });
  const voor = t.slice(0, delen[0].index).trim();
  const lijst = s => {
    const regels = s.split(/\n+/).map(x => x.replace(/^\s*[-*•]\s*/, "").trim()).filter(Boolean);
    return regels.length > 1 ? `<ul>${regels.map(r => `<li>${opmaak(r)}</li>`).join("")}</ul>` : opmaak(s);
  };
  const bewijsRijen = s => {
    const regels = s.split(/\n+/).map(x => x.replace(/^\s*[-*•]\s*/, "").trim()).filter(Boolean);
    const max = 3;
    const rijen = regels.map((r, i) => {
      const m = r.match(/^\**\s*((?:dag\s*\d+(?:\s*[-–]\s*\d+)?)(?:[ ,]+(?:om\s+)?\d{1,2}[:.]\d{2}(?:\s*[-–]\s*\d{1,2}[:.]\d{2})?)?)\s*\**\s*[:,–-]\s*(.+)$/i);
      const cls = (m ? "" : "zonder-tijd") + (i >= max ? " verborgen" : "");
      return m ? `<li class="${cls}"><span class="wanneer">${esc(m[1].replace(/\s+/g, " "))}</span><span>${opmaak(m[2])}</span></li>` : `<li class="${cls}"><span>${opmaak(r)}</span></li>`;
    }).join("");
    return `<ul class="bewijs-lijst">${rijen}</ul>${regels.length > max ? `<button class="meer" data-meer-lijst>+ ${regels.length - max} meer</button>` : ""}`;
  };
  let h = voor ? `<div>${opmaak(voor)}</div>` : "";
  if (stukken.antwoord) h += `<p class="kern">${opmaak(stukken.antwoord)}</p>`;
  if (stukken.bewijs) h += `<div class="deel"><div class="deel-label">Bewijs</div>${bewijsRijen(stukken.bewijs)}</div>`;
  const verw = stukken.verwijzingen && !/^geen\.?$/i.test(stukken.verwijzingen) ? `<div class="deel"><div class="deel-label">Verwijzingen</div>${lijst(stukken.verwijzingen)}</div>` : "";
  const onz = stukken.onzeker ? `<div class="deel onzeker"><div class="deel-label">Onzeker</div>${lijst(stukken.onzeker)}</div>` : "";
  h += `<details class="extra"><summary>Details</summary>${onz}${verw}${details}</details>`;
  return h;
}

function render(trace, verdict) {
  laatste = [trace, verdict];
  const bezig = trace.status === "bezig", afgebroken = trace.status === "afgebroken";
  const st = $("status");
  st.className = "status " + (bezig ? "bezig" : afgebroken ? "afgebroken" : "klaar");
  st.textContent = bezig ? (trace.aan_het_woord ? `${naam(trace.aan_het_woord)} ${trace.aan_het_woord === "koning" ? "beraadt zich" : "spreekt"}…` : "bezig")
    : afgebroken ? `afgebroken · ${trace.fout?.soort || "fout"}` : "klaar";
  st.title = afgebroken ? String(trace.fout?.melding || "") : "";
  const o = trace.opzet || {};
  $("runid").textContent = [trace.run_id, o.model_koning && `Koning: ${o.model_koning}`, o.model_raadsleden && `Raadsleden: ${o.model_raadsleden}`].filter(Boolean).join("  ·  ");

  const beurten = trace.beurten || [];
  const telling = {}, padfouten = [], koningTools = [], vreemdeIds = [], zonderRoutering = [], pipKleuren = [];
  let toegewezen = null, raadslidBeurten = 0, laatsteStand = null, html = "", stopte = false, wachtendeBronnen = [];
  for (const b of beurten) {
    const t = telling[b.spreker] ??= { berichten: 0, tools: 0, ids: new Set() };
    const zichtbaar = !filter || b.spreker === filter || b.aan === filter;
    if (b.soort === "routering") {
      toegewezen = b.aan;
      if (b.stand) laatsteStand = { stand: b.stand, open: b.open_vragen || [], nr: b.nr };
      if (!b.aan) stopte = true;
      if (!zichtbaar) continue;
      const vlag = b.beslist_door && b.beslist_door !== "koning-agent"
        ? `<span class="chip ${b.beslist_door.startsWith("koning-agent") ? "let" : "fout"}" title="Wie besliste deze routering">${esc(b.beslist_door)}</span>` : "";
      const toetst = (b.toetst_beurten || []).length ? `<span class="chip">toetst ${b.toetst_beurten.map(ref).join(" ")}</span>` : "";
      const doel = b.doel ? `<span class="chip doel">${esc(b.doel)}</span>` : "";
      const open = (b.open_vragen || []).length ? `<div style="margin-top:8px"><b>Open vragen</b><ol class="open-lijst">${b.open_vragen.map(v => `<li>${opmaak(v)}</li>`).join("")}</ol></div>` : "";
      const waarom = `<details class="waarom"${b.aan ? "" : " open"}><summary>Waarom</summary><div class="inhoud">${beurtLinks(opmaak(b.reden))}${toetst ? `<div style="margin-top:6px">${toetst}</div>` : ""}${open}</div></details>`;
      html += b.aan
        ? `<div class="ronde-kop">Beurt ${esc(b.ronde)}</div><div class="decreet" id="b${b.nr}">${av("koning")}<div class="lijf"><div class="regel1"><span class="naar">Koning vraagt <span style="color:${kleur(b.aan)}">${esc(naam(b.aan))}</span></span>${doel}${vlag}</div><div class="vraag">${klem(beurtLinks(opmaak(b.vraag)), 2)}</div>${waarom}</div></div>`
        : `<div class="ronde-kop">Einde debat</div><div class="decreet stop" id="b${b.nr}">${av("koning")}<div class="lijf"><div class="regel1"><span class="naar">De Koning sluit het debat</span>${vlag}</div>${waarom}</div></div>`;
      continue;
    }
    if (b.soort === "bericht" && NAMEN[b.spreker] && !["koning", "mens"].includes(b.spreker)) {
      raadslidBeurten++;
      pipKleuren.push(kleur(b.spreker));
      if (toegewezen !== b.spreker) zonderRoutering.push(b.nr);
      toegewezen = null;
    }
    if (b.soort === "bericht") {
      t.berichten++;
      for (const x of ids(b.tekst)) { t.ids.add(x.id); if (x.raar) vreemdeIds.push(x.id); }
      const bronnen = wachtendeBronnen; wachtendeBronnen = [];
      if (!zichtbaar) continue;
      const c = b.id_controle;
      const badge = c ? `<span class="chip ${c.ongeldig?.length ? "fout" : "ok"}" title="ID-controle: alleen ID's die dit Raadslid in de eigen Kennisbron las tellen${c.ongeldig?.length ? ". Ongeldig: " + esc(c.ongeldig.join(", ")) : ""}">${c.ongeldig?.length ? "✗" : "✓"} ${(c.geldig || []).length} ID's geverifieerd${c.ongeldig?.length ? " · " + c.ongeldig.length + " ongeldig" : ""}</span>` : "";
      const meta = "";
      const vink = c ? `<span class="vink${c.ongeldig?.length ? " fout" : ""}" title="${(c.geldig || []).length} ID's geverifieerd in de eigen Kennisbron${c.ongeldig?.length ? "; ongeldig: " + esc(c.ongeldig.join(", ")) : ""}">${c.ongeldig?.length ? "✗ ongeldige ID's" : "✓ bron gelezen"}</span>` : "";
      const details = `${bronnen.length ? `<div class="bronnen">${bronnen.join("")}</div>` : (b.spreker === "koning" ? "" : `<div class="bronnen"><span class="chip let">geen toolcall: Kennisbron niet gelezen</span></div>`)}<div style="font-size:12px;color:var(--zacht);margin-top:4px">${(c?.geldig || []).length} ID's geverifieerd${b.duur_s ? " · " + b.duur_s + "s" : ""}${b.tijd ? " · " + esc(b.tijd.slice(11, 19)) : ""} · beurt ${b.nr}</div>`;
      const isKoning = b.spreker === "koning";
      const bronRegel = "";
      if (isKoning) html += `<div class="ronde-kop">Verdict van de Koning</div>`;
      html += `<div class="bericht${isKoning ? " koning" : ""}" id="b${b.nr}" style="--kleur:${kleur(b.spreker)}">${av(b.spreker, "groot")}<div class="lijf"><div class="kopregel"><span class="wie">${esc(naam(b.spreker))}</span>${isKoning ? "" : vink}</div><div class="tekst">${isKoning ? klem(opmaak(b.tekst), 6) : structuur(b.tekst, details)}</div></div></div>`;
    } else {
      t.tools++;
      let vlag = "";
      if (b.soort === "toolcall") {
        if (b.spreker === "koning") { koningTools.push(b.nr); vlag = ` <span class="chip fout">Koning leest een Kennisbron</span>`; }
        else if (b.pad && !b.pad.includes(`/${b.spreker}/`)) { padfouten.push(b.nr); vlag = ` <span class="chip fout">pad van een andere Rol</span>`; }
      }
      if (b.soort === "bestand" && b.bestand && !b.bestand.startsWith(b.spreker + "/")) { padfouten.push(b.nr); vlag = ` <span class="chip fout">bestand van een andere Rol</span>`; }
      const args = Object.entries(b.argumenten || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
      const wat = b.soort === "toolcall"
        ? `📖 <code title="${esc((b.pad || "").replace(/^https?:\/\//, ""))}">${esc(b.tool)}(${esc(args.length > 70 ? args.slice(0, 70) + "…" : args)})</code>${b.resultaat ? ` → ${b.resultaat.records} records` : ""}`
        : `📄 <code>${esc(b.bestand)}</code> in de prompt`;
      wachtendeBronnen.push(`<span class="bron" id="b${b.nr}">${wat}${vlag}</span>`);
    }
  }
  if (bezig && trace.aan_het_woord && (!filter || filter === trace.aan_het_woord || trace.aan_het_woord === "koning")) {
    const r = trace.aan_het_woord;
    html += `<div class="bericht denkt" style="--kleur:${kleur(r)}">${av(r, "groot")}<div class="lijf">${esc(naam(r))} ${r === "koning" ? "weegt het debat" : "leest de Kennisbron en denkt na"}<span class="stippen"><i></i><i></i><i></i></span></div></div>`;
  }
  const onderaan = window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
  $("debat").innerHTML = html || `<p class="melding"><span class="groot">⏳</span>De run is gestart; de eerste beurt komt eraan.</p>`;
  if (bezig && onderaan && tab === "debat") window.scrollTo(0, document.body.scrollHeight);
  $("tel-debat").textContent = raadslidBeurten;

  // Overzicht: wie sprak in welke volgorde, met het doel van de Koning; klik om te springen
  const stappen = [];
  for (const b of beurten) if (b.soort === "routering") stappen.push(b.aan
    ? `<a class="stap" href="#b${b.nr}" data-ga="${b.nr}" title="Beurt ${esc(b.ronde)}: ${esc(naam(b.aan))}${b.doel ? " · " + esc(b.doel) : ""}">${av(b.aan)}<small>${esc(b.doel || naam(b.aan))}</small></a>`
    : `<a class="stap einde" href="#b${b.nr}" data-ga="${b.nr}" title="De Koning sluit het debat">${av("koning")}<small>einde</small></a>`);
  $("verloop").hidden = !stappen.length;
  $("verloop").innerHTML = `<span class="verloop-label">Verloop</span>` + stappen.join('<span class="pijl">→</span>');

  // Beurtenbudget: één pip per Raadslid-beurt, in de kleur van de spreker
  $("pips").innerHTML = Array.from({ length: BEURTENBUDGET }, (_, i) =>
    i < pipKleuren.length ? `<span class="pip vol" style="--kleur:${pipKleuren[i]}"></span>`
      : stopte && i === pipKleuren.length ? `<span class="pip stop" title="De Koning stopte zelf"></span>` : `<span class="pip"></span>`).join("");
  $("budget-label").textContent = `Beurtenbudget · ${raadslidBeurten}/${BEURTENBUDGET}${stopte ? " · Koning stopte zelf" : ""}`;

  // De Raad
  $("raad").innerHTML = [...(trace.raadsleden || []), "koning"].map(r => {
    const t = telling[r] || { berichten: 0, tools: 0, ids: new Set() };
    const spreekt = bezig && trace.aan_het_woord === r ? " spreekt" : "";
    const stil = r !== "koning" && !t.berichten ? " stil" : "";
    const sub = r === "koning" ? `${beurten.filter(b => b.soort === "routering").length} besluiten` : `${t.berichten} beurt${t.berichten === 1 ? "" : "en"} · ${t.ids.size} ID's`;
    return `<button class="zetel${spreekt}${stil}" style="--kleur:${kleur(r)}" data-rol="${r}" aria-pressed="${filter === r}" title="Filter het debat op ${esc(naam(r))}">${av(r)}<span><span class="naam">${esc(naam(r))}</span><br><span class="sub">${sub}</span></span></button>`;
  }).join("");
  $("filterinfo").hidden = !filter;
  if (filter) $("filterinfo").innerHTML = `Alleen beurten van en naar <b style="color:${kleur(filter)}">${esc(naam(filter))}</b> · <button data-wis>alles tonen</button>`;

  // Werkgeheugen van de Koning
  $("stand").innerHTML = laatsteStand
    ? Object.keys(SLOTS).map(k => {
        const w = laatsteStand.stand[k] || "onbekend", bekend = !/^onbekend/i.test(w);
        return `<div class="slot"><div class="slot-kop"><span><span class="lamp${bekend ? " aan" : ""}"></span>${SLOTS[k][0]}</span></div>${klem(opmaak(w), 3)}</div>`;
      }).join("")
      + `<div class="slot"><div class="slot-kop"><span>Open vragen</span><span>na ${ref(laatsteStand.nr)}</span></div>${laatsteStand.open.length ? `<ol class="vragen">${laatsteStand.open.map(v => `<li>${opmaak(v)}</li>`).join("")}</ol>` : '<span class="leeg">geen</span>'}</div>`
    : '<span class="leeg">nog geen routering</span>';

  // Spelregels
  const zonderBron = (trace.raadsleden || []).filter(r => telling[r]?.berichten && !telling[r]?.tools);
  const checks = [
    [padfouten.length ? "fout" : "ok", padfouten.length ? `Kennisbron van een andere Rol gelezen (beurt ${padfouten.join(", ")})` : "Elk Raadslid las alleen de eigen Kennisbron"],
    [koningTools.length ? "fout" : "ok", koningTools.length ? `Koning las een Kennisbron (beurt ${koningTools.join(", ")})` : "Koning las geen Kennisbron"],
    [zonderBron.length ? "let" : "ok", zonderBron.length ? `Sprak zonder bron: ${zonderBron.map(naam).join(", ")}` : "Elk Raadslid las zijn bron vóór het sprak"],
    [vreemdeIds.length ? "let" : "ok", vreemdeIds.length ? `ID's met een vreemd koppelteken: ${[...new Set(vreemdeIds)].join(", ")}` : "ID's in de juiste vorm"],
    [(trace.raadsleden || []).length >= 3 ? "ok" : "let", `${(trace.raadsleden || []).length} Rollen (minimum 3)`],
    [raadslidBeurten > BEURTENBUDGET ? "fout" : "ok", `${raadslidBeurten} van ${BEURTENBUDGET} Raadslid-beurten`],
    [zonderRoutering.length ? "fout" : "ok", zonderRoutering.length ? `Raadslid-beurt zonder Routering (beurt ${zonderRoutering.join(", ")})` : "Routering vóór elke Raadslid-beurt"],
  ];
  const zc = trace.zelfcontrole;
  if (zc) {
    checks.push([zc.fouten.length ? "fout" : "ok", zc.fouten.length ? `Zelfcontrole: ${zc.fouten.length} fout(en)` : "Zelfcontrole van de run: groen"]);
    for (const f of zc.fouten) checks.push(["fout", f]);
    for (const l of zc.let_op) checks.push(["let", l]);
  }
  if (afgebroken) checks.unshift(["fout", `Run afgebroken (${trace.fout?.soort || "fout"}): geen Verdict`]);
  const checkHtml = checks.map(([k, t]) => `<div class="check ${k}">${esc(t)}</div>`).join("");
  $("checks-kort").innerHTML = checkHtml;
  const nFout = checks.filter(c => c[0] === "fout").length, nLet = checks.filter(c => c[0] === "let").length;
  $("tel-controle").textContent = nFout ? `${nFout} ✗` : nLet ? `${nLet} !` : "✓";

  // Controle-tab
  const v = trace.verbruik || {};
  const verbruik = Object.keys(v).length
    ? `<table><tr><th>Model</th><th class="r">Calls</th><th class="r">Tokens in</th><th class="r">Tokens uit</th></tr>${Object.entries(v).map(([m, x]) => `<tr><td>${esc(m)}</td><td class="r">${x.beurten ?? x.calls ?? ""}</td><td class="r">${(x.invoer || 0).toLocaleString("nl-BE")}</td><td class="r">${(x.uitvoer || 0).toLocaleString("nl-BE")}</td></tr>`).join("")}</table>`
    : '<span class="leeg">nog geen calls</span>';
  const kb = o.kennisbron_per_raadslid || {};
  const opzet = Object.keys(kb).length
    ? `<table><tr><th>Raadslid</th><th>Eigen Kennisbron (MCP)</th></tr>${Object.entries(kb).map(([r, p]) => `<tr><td>${AVATAR[r] || ""} ${esc(naam(r))}</td><td><code>${esc(String(p).replace(/^https?:\/\//, ""))}</code></td></tr>`).join("")}<tr><td>👑 Koning</td><td>${(o.tools_koning || []).length ? esc(o.tools_koning.join(", ")) : "geen tools, geen Kennisbron"}</td></tr></table>`
    : '<span class="leeg">—</span>';
  const vc = trace.verdict_controle;
  $("controle").innerHTML = `<div class="kaart"><h2>Spelregels</h2><div class="kaart-body">${checkHtml}</div></div>`
    + `<div class="kaart"><h2>Werkgeheugen van de Koning</h2><div class="kaart-body">${$("stand").innerHTML}</div></div>`
    + `<div class="kaart"><h2>Run</h2><div class="kaart-body" style="font-size:13px">${esc(trace.run_id || "")}<br>Koning: ${esc(o.model_koning || "?")} · Raadsleden: ${esc(o.model_raadsleden || "?")}</div></div>`
    + `<div class="kaart"><h2>Isolatie per Rol</h2><div class="kaart-body">${opzet}</div></div>`
    + `<div class="kaart"><h2>Verbruik</h2><div class="kaart-body">${verbruik}</div></div>`
    + (vc ? `<div class="kaart"><h2>ID-controle van het Verdict</h2><div class="kaart-body"><p style="margin-top:0;font-size:13px">${(vc.geldige_ids || []).length} ID's mochten in het Verdict: door Raadsleden genoemd én in hun eigen Kennisbron gelezen.</p>${(vc.verwijderd || []).length ? `<b style="font-size:13px">Verwijderd door de controle</b><ul style="font-size:13px;margin:4px 0 0">${vc.verwijderd.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : '<div class="check ok">Niets verwijderd</div>'}</div></div>` : "");

  // Geschillen
  const gs = trace.geschillen || [];
  $("tel-geschillen").textContent = gs.length;
  $("geschillen").innerHTML = gs.length ? `<div class="geschillen">${gs.map(g => {
    const beslecht = !!g.uitkomst;
    return `<div class="kaart geschil"><h3><span>${esc(g.onderwerp)}</span><span class="chip ${beslecht ? "ok" : "let"}">${beslecht ? "beslecht" : "open"}</span></h3>
      ${Object.entries(g.standpunten || {}).map(([r, s]) => `<div class="standpunt">${av(r)}<div><b style="color:${kleur(r)}">${esc(naam(r))}</b>${klem(opmaak(s), 3)}</div></div>`).join("")}
      <div class="uitkomst${beslecht ? "" : " open"}"><b>${beslecht ? "Uitkomst" : "Niet beslecht"}</b>${beslecht ? ": " + opmaak(g.uitkomst) : ""}${(g.bewijs || []).length ? `<div style="margin-top:6px">${idBlok(g.bewijs)}</div>` : ""}${(g.beurten || []).length ? `<div style="margin-top:6px;font-size:12px;color:var(--zacht)">in beurt ${g.beurten.map(n => ref(n)).join(" ")}</div>` : ""}</div></div>`;
  }).join("")}</div>` : `<p class="melding"><span class="groot">🤝</span>${bezig ? "De geschillen verschijnen zodra de Koning het Verdict opstelt." : "Geen geschillen vastgelegd."}</p>`;

  // Verdict
  const vd = $("verdict"), tv = $("tel-verdict");
  if (!verdict || verdict.run_id !== trace.run_id) {
    tv.textContent = "—"; tv.classList.remove("nieuw");
    vd.innerHTML = `<p class="melding"><span class="groot">${bezig ? "⚖️" : "📭"}</span>${verdict ? "verdict.json hoort bij een andere run." : bezig ? "Het Verdict volgt zodra de Koning het debat sluit." : "Geen verdict.json."}</p>`;
  } else {
    tv.textContent = "✓";
    if (!verdictGezien && tab !== "verdict") tv.classList.add("nieuw");
    const oz = verdict.oorzaak || {};
    const kaartSlot = k => {
      const s = oz[k] || {}, [titel, wat, ic] = SLOTS[k];
      const z = typeof s.zekerheid === "number" ? `<div class="meter"><span>zekerheid</span><span class="balk"><i style="width:${Math.round(s.zekerheid * 100)}%"></i></span><b>${Math.round(s.zekerheid * 100)}%</b></div>` : "";
      return `<div class="kaart"><h3>${ic} ${titel}</h3><div class="wat">${wat}</div>${z}<div>${s.bewering ? klem(opmaak(s.bewering), 6) : '<span class="leeg">onbekend (null)</span>'}</div>${idBlok(s.bewijs)}</div>`;
    };
    const vs = verdict.voorspelling;
    vd.innerHTML = `<div class="kaart samenvatting">${verdict.samenvatting === "TODO" ? '<span class="leeg">TODO</span>' : opmaak(verdict.samenvatting)}</div>
      <div class="sectiekop">Oorzaak</div>
      <div class="oorzaak">${Object.keys(SLOTS).map(kaartSlot).join("")}</div>
      <div class="verdict-grid">
        <div class="kaart"><h2>Herstelplan · in volgorde</h2><div class="kaart-body"><ol class="stappen">${(verdict.acties || []).map(a => `<li><div><div class="actie">${opmaak(a.actie)}</div><div class="reden">${opmaak(a.reden)}</div>${idBlok(a.bewijs)}</div></li>`).join("")}</ol></div></div>
        <div style="display:flex;flex-direction:column;gap:16px">
          ${vs ? `<div class="kaart voorspelling"><div class="sectiekop">Volgende Desync als niemand ingrijpt</div><div class="dag">dag ${esc(vs.dag)}</div><p>${opmaak(vs.bewering)}</p>${idChips(vs.bewijs)}</div>` : ""}
          <div class="kaart"><h2>Risico's</h2><div class="kaart-body">${(verdict.risicos || []).map(r => `<div class="risico"><b>${opmaak(r.risico)}</b><div class="mit">${opmaak(r.mitigatie)}</div></div>`).join("")}</div></div>
        </div>
      </div>`;
  }
}

function meerKnoppen() {
  document.querySelectorAll(".klem:not(.open)").forEach(el => {
    const knop = el.nextElementSibling?.matches?.(".meer[data-meer-klem]") ? el.nextElementSibling : null;
    const loopt = el.scrollHeight > el.clientHeight + 2;
    if (loopt && !knop) el.insertAdjacentHTML("afterend", '<button class="meer" data-meer-klem>lees meer</button>');
    if (!loopt && knop) knop.remove();
  });
}
const renderOrig = render;
render = (...a) => { renderOrig(...a); requestAnimationFrame(meerKnoppen); };

/* ---------- interactie ---------- */
function kiesTab(naamTab) {
  tab = naamTab;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === naamTab));
  document.querySelectorAll(".paneel-tab").forEach(p => p.hidden = p.id !== "tab-" + naamTab);
  if (naamTab === "verdict") { verdictGezien = true; $("tel-verdict").classList.remove("nieuw"); }
  history.replaceState(null, "", "#" + naamTab);
  window.scrollTo(0, 0);
  requestAnimationFrame(meerKnoppen);  // ingeklemde tekst meten zodra de tab zichtbaar is
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => kiesTab(b.dataset.tab)));
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = { 1: "debat", 2: "verdict", 3: "geschillen", 4: "controle" }[e.key];
  if (t) kiesTab(t);
  if (e.key === "Escape" && filter) { filter = null; laatste && render(...laatste); }
});
document.addEventListener("click", e => {
  const mk = e.target.closest("[data-meer-klem]");
  if (mk) { const el = mk.previousElementSibling; const open = el.classList.toggle("open"); mk.textContent = open ? "minder" : "lees meer"; return; }
  const ml = e.target.closest("[data-meer-lijst]");
  if (ml) { const ul = ml.previousElementSibling; const open = ul.classList.toggle("open"); ml.textContent = open ? "minder" : `+ ${ul.querySelectorAll(".verborgen").length} meer`; return; }
  const dk = e.target.closest("[data-dicht]");
  if (dk) { dicht = dk.dataset.dicht; localStorage.setItem("achrona-dicht", dicht); zetDicht(); laatste && render(...laatste); return; }
  const z = e.target.closest(".zetel");
  if (z) { filter = filter === z.dataset.rol ? null : z.dataset.rol; laatste && render(...laatste); return; }
  if (e.target.closest("[data-wis]")) { filter = null; laatste && render(...laatste); return; }
  const r = e.target.closest("a.ref[data-ga]");
  if (r && (tab !== "debat" || filter)) {
    e.preventDefault(); filter = null; kiesTab("debat"); laatste && render(...laatste);
    setTimeout(() => { document.getElementById("b" + r.dataset.ga)?.scrollIntoView({ block: "center" }); }, 30);
  }
});
const thema = localStorage.getItem("achrona-thema") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = thema;
$("thema").addEventListener("click", () => {
  const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = n; localStorage.setItem("achrona-thema", n);
});
function zetDicht() { document.querySelectorAll("[data-dicht]").forEach(b => b.setAttribute("aria-pressed", b.dataset.dicht === dicht)); }
zetDicht();
window.addEventListener("resize", () => requestAnimationFrame(meerKnoppen));
const start = location.hash.slice(1);
if (["verdict", "geschillen", "controle"].includes(start)) kiesTab(start);

async function haal(pad) {
  try { const r = await fetch(pad, { cache: "no-store" }); return r.ok ? await r.text() : null; } catch { return null; }
}
async function lus() {
  const [t, v] = await Promise.all([haal("trace.json"), haal("verdict.json")]);
  if (t && t + (v || "") !== vorige) {
    vorige = t + (v || "");
    try { render(JSON.parse(t), v ? JSON.parse(v) : null); } catch (e) { console.warn(e); /* bestand half geschreven: volgende ronde opnieuw */ }
  }
  setTimeout(lus, 1500);
}
lus();
</script>
</body>
</html>
